<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Automated Task Reminder System</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260314">
</head>
<body>
<main class="login-shell">
    <section class="login-card">
        <h1>Create Account</h1>
        <p>Sign up to access task reminders, notifications, and AI-assisted task planning.</p>

        <form th:action="@{/signup}" method="post" class="login-form">
            <div class="form-group">
                <label for="username"><strong>Username</strong></label>
                <input id="username" name="username" type="text" th:value="${username}" autocomplete="username" required />
            </div>

            <div class="form-group">
                <label for="email"><strong>Email</strong></label>
                <input id="email" name="email" type="email" th:value="${email}" autocomplete="email" placeholder="optional@example.com" />
            </div>

            <div class="form-group">
                <label for="password"><strong>Password</strong></label>
                <input id="password" name="password" type="password" autocomplete="new-password" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword"><strong>Confirm Password</strong></label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
        </form>

        <p class="login-message" th:if="${registerError}" th:text="${registerError}"></p>
        <p class="login-message success" style="margin-top: 0.7rem;">
            Already have an account?
            <a href="/login">Sign in here</a>
        </p>
    </section>
</main>
</body>
</html>
