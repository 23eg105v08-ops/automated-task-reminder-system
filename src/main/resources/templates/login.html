<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Automated Task Reminder System</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260314">
</head>
<body>
<main class="login-shell">
    <section class="login-card">
        <h1>Task Reminder Login</h1>
        <p>Sign in to manage tasks, receive escalation popups, and keep deadlines under control.</p>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username"><strong>Username</strong></label>
                <input id="username" name="username" type="text" autocomplete="username" required />
            </div>

            <div class="form-group">
                <label for="password"><strong>Password</strong></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>

        <p class="login-message" th:if="${param.error}">Invalid username or password. Please try again.</p>
        <p class="login-message success" th:if="${param.registered}">Account created successfully. Please sign in.</p>
        <p class="login-message success" th:if="${param.logout}">You have been logged out successfully.</p>
        <p class="login-message success" style="margin-top: 0.7rem;">
            New user?
            <a href="/signup">Create an account</a>
        </p>
    </section>
</main>
</body>
</html>
