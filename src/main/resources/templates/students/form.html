<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Form - Student Management System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1 th:text="${student.id != null} ? '✏️ Edit Student' : '➕ Add New Student'"></h1>
        <nav>
            <a href="/">← Back to Dashboard</a>
            <a href="/students">View All Students</a>
        </nav>
    </header>

    <main style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}" />

            <label>
                <strong>First Name</strong>
                <input type="text" th:field="*{firstName}" placeholder="John" required />
            </label>

            <label>
                <strong>Last Name</strong>
                <input type="text" th:field="*{lastName}" placeholder="Doe" required />
            </label>

            <label>
                <strong>Email Address</strong>
                <input type="email" th:field="*{email}" placeholder="john.doe@example.com" required />
            </label>

            <label>
                <strong>Enrollment Date</strong>
                <input type="date" name="enrollmentDateStr" th:value="${student.enrollmentDate}" required />
            </label>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <span th:if="${student.id == null}">Create Student</span>
                    <span th:if="${student.id != null}">Update Student</span>
                </button>
                <a href="/students" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
