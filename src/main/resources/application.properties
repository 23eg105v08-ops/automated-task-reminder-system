
spring.application.name=automated-task-reminder
# MySQL configuration (override via environment variables as needed)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskreminder}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 console disabled for MySQL mode
spring.h2.console.enabled=false

# Disable static resource caching during development
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# AI integration (set GEMINI_API_KEY in your environment)
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ai.gemini.api-key=${GEMINI_API_KEY:}

# Auto risk escalation check interval (milliseconds)
task.escalation.fixed-delay-ms=60000

